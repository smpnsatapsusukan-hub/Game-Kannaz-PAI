<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KANNAZ Petualangan Pesawat PAI Kelas 2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Comic Sans MS','Segoe UI',sans-serif}
body{margin:0;background:linear-gradient(180deg,#0b1d3a,#123a6b 60%,#1b5e20);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff}
#game{position:relative;width:min(96vw,520px);height:min(92vh,760px);border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);background:linear-gradient(180deg,#0b1d3a,#123a6b)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.screen{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(20,83,145,.78),rgba(4,20,45,.95) 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:12px;overflow:auto}
.hidden{display:none}
h1{font-size:30px;color:#ffd54f;text-shadow:0 3px 0 #b26a00,0 0 18px rgba(255,213,79,.45)}
h2{color:#80deea;font-size:20px}
p{font-size:14px;line-height:1.5;color:#e3f2fd}
input,select{width:100%;max-width:300px;padding:12px;border-radius:14px;border:3px solid #4fc3f7;font-size:16px;font-weight:800;text-align:center;outline:none}
button{background:linear-gradient(180deg,#ffb300,#fb8c00);border:0;color:#4e2600;font-weight:900;font-size:16px;padding:13px 22px;border-radius:16px;cursor:pointer;box-shadow:0 5px 0 #b26a00;transition:transform .15s,filter .15s,box-shadow .15s}
button:hover{filter:brightness(1.12)}
button:active{transform:translateY(4px);box-shadow:none}
button.small{font-size:12px;padding:8px 12px;box-shadow:0 3px 0 #b26a00}
button.hero{position:relative;overflow:hidden;padding:15px 28px;border:2px solid #fff3a6;background:linear-gradient(115deg,#ffca28,#ff8f00 45%,#ffca28);background-size:220% 100%;color:#512400;font-size:18px;letter-spacing:.3px;box-shadow:0 6px 0 #b26a00,0 0 22px rgba(255,183,0,.45);animation:buttonGlow 2s ease-in-out infinite,buttonShine 4s linear infinite}
button.hero:before{content:'';position:absolute;inset:-60% auto -60% -35%;width:25%;transform:rotate(25deg);background:rgba(255,255,255,.55);filter:blur(8px);animation:shineSweep 2.8s ease-in-out infinite}
@keyframes buttonGlow{50%{box-shadow:0 6px 0 #b26a00,0 0 34px rgba(255,213,79,.8);transform:translateY(-2px)}}
@keyframes buttonShine{to{background-position:220% 0}}
@keyframes shineSweep{0%,30%{left:-35%}75%,100%{left:120%}}
.badge{font-size:52px;filter:drop-shadow(0 0 12px rgba(255,213,79,.65));animation:badgeFloat 2.8s ease-in-out infinite}
@keyframes badgeFloat{50%{transform:translateY(-7px) rotate(2deg);filter:drop-shadow(0 0 20px rgba(79,195,247,.85))}}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;font-weight:900;font-size:13px;pointer-events:none}
.hud div{background:rgba(0,0,0,.45);padding:6px 10px;border-radius:12px;border:2px solid rgba(255,255,255,.25)}
.question{position:absolute;top:52px;left:10px;right:10px;background:rgba(255,255,255,.94);color:#0d47a1;font-weight:900;font-size:15px;padding:10px;border-radius:14px;text-align:center;pointer-events:none;line-height:1.35;box-shadow:0 0 18px rgba(79,195,247,.25)}
.msg{position:absolute;bottom:14px;left:10px;right:10px;text-align:center;font-weight:900;font-size:15px;color:#fff;pointer-events:none;text-shadow:0 2px 4px #000}
@media(prefers-reduced-motion:reduce){*,*:before{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <div class="screen" id="menu">
    <div class="badge">✈️🕌⭐</div>
    <h1>KANNAZ</h1>
    <h2>Petualangan Pesawat PAI</h2>
    <p>Terbangkan pesawatmu, tembak jawaban yang benar, dan selesaikan misi PAI Kelas 2 Semester 1!</p>
    <input id="nameInput" placeholder="Tulis namamu di sini" maxlength="18">
    <select id="levelSelect">
      <option value="0">Bab 1 — Ayo Belajar Al-Qur'an</option>
      <option value="1">Bab 2 — Mengenal Allah Swt.</option>
      <option value="2">Bab 3 — Perilaku Terpuji</option>
      <option value="3">Bab 4 — Ayo Bisa Salat</option>
      <option value="4">Bab 5 — Keteladanan Nabi Nuh a.s.</option>
    </select>
    <button class="hero" onclick="startGame()">🚀 Mulai Petualangan!</button>
    <button class="small" onclick="toggleSound()" id="soundBtn">🔊 Suara: ON</button>
    <p>Sentuh jawaban untuk menembaknya langsung!<br>Geser layar / gunakan ← → untuk bergerak, atau Spasi untuk menembak lurus.</p>
  </div>

  <div class="screen hidden" id="result">
    <div class="badge" id="resultIcon">🏆</div>
    <h1 id="resultTitle">Misi Selesai!</h1>
    <p id="resultText"></p>
    <button onclick="backToMenu()">🏠 Menu Utama</button>
    <button class="small" onclick="startGame()">🔁 Ulangi Misi</button>
  </div>

  <div class="hud hidden" id="hud">
    <div>👦 <span id="playerName">Anak</span></div>
    <div>⭐ <span id="score">0</span></div>
    <div>❤️ <span id="lives">3</span></div>
    <div>🎯 <span id="qNum">1/4</span></div>
  </div>
  <div class="question hidden" id="questionBox"></div>
  <div class="msg hidden" id="msg"></div>
</div>

<script>
const LEVELS=[
 {title:"Ayo Belajar Al-Qur'an",icon:'📖',questions:[
  {q:'Surah yang kita hafal pada Bab 1 adalah Surah…',opts:['An-Nas','Al-Fatihah','Al-Ikhlas'],a:0},
  {q:'Surah An-Nas terdiri dari berapa ayat?',opts:['3 ayat','6 ayat','10 ayat'],a:1},
  {q:'Kita berlindung kepada…',opts:['Setan','Allah Swt.','Bintang'],a:1},
  {q:'Ilmu tentang tempat keluar huruf disebut…',opts:['Makharijul huruf','Rukun salat','Wudhu'],a:0}]},
 {title:'Mengenal Allah Swt.',icon:'🌟',questions:[
  {q:'Allah Maha Memelihara adalah…',opts:['Al-Hafiz','Al-Wali','Al-Khabir'],a:0},
  {q:'Allah Maha Melindungi adalah…',opts:['Al-Alim','Al-Wali','Al-Hafiz'],a:1},
  {q:'Allah Maha Mengetahui adalah…',opts:['Al-Khabir','Al-Hafiz','Al-Alim'],a:2},
  {q:'Allah Maha Teliti adalah…',opts:['Al-Khabir','Al-Wali','Al-Alim'],a:0}]},
 {title:'Perilaku Terpuji',icon:'🤝',questions:[
  {q:'Jika teman kesulitan, sebaiknya kita…',opts:['Menolong','Menertawakan','Mengabaikan'],a:0},
  {q:'Berbicara kepada orang lain sebaiknya dengan…',opts:['Kata kasar','Kata lembut','Berteriak'],a:1},
  {q:'Tidak berbohong disebut sikap…',opts:['Jujur','Sombong','Iri'],a:0},
  {q:'Menyayangi sesama adalah perilaku…',opts:['Terpuji','Tidak baik','Dilarang'],a:0}]},
 {title:'Ayo Bisa Salat',icon:'🕌',questions:[
  {q:'Panggilan untuk menunaikan salat disebut…',opts:['Azan','Ikamah','Takbir'],a:0},
  {q:'Panggilan segera mendirikan salat disebut…',opts:['Azan','Ikamah','Doa'],a:1},
  {q:'Salat fardu dalam sehari ada…',opts:['3 waktu','5 waktu','7 waktu'],a:1},
  {q:'Gerakan salat setelah rukuk adalah…',opts:['Sujud','Duduk','Berdiri'],a:0}]},
 {title:'Keteladanan Nabi Nuh a.s.',icon:'🚢',questions:[
  {q:'Nabi yang membangun kapal besar adalah Nabi…',opts:['Nuh a.s.','Musa a.s.','Isa a.s.'],a:0},
  {q:'Nabi Nuh a.s. mengajak umatnya menyembah…',opts:['Berhala','Allah Swt.','Matahari'],a:1},
  {q:'Sikap Nabi Nuh a.s. saat menghadapi tantangan adalah…',opts:['Sabar','Marah','Menyerah'],a:0},
  {q:'Nabi Nuh a.s. membuat kapal karena perintah…',opts:['Raja','Allah Swt.','Teman'],a:1}]}
];

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,plane={x:0,y:0,w:64,h:64},bullets=[],bubbles=[],stars=[],keys={},touchX=null;
let state='menu',level=0,qIndex=0,score=0,lives=3,soundOn=true,anim=0,audioCtx=null,shotCount=0,particles=[],shootingStars=[];

function resize(){
 const r=document.getElementById('game').getBoundingClientRect();
 W=cv.width=r.width;H=cv.height=r.height;
 plane.x=W/2;plane.y=H-90;
 stars=Array.from({length:100},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2.2+.5,alpha:Math.random()*.7+.25,phase:Math.random()*Math.PI*2}));
 shootingStars=[];
}
window.addEventListener('resize',resize);

function getAudio(){
 if(!soundOn)return null;
 const AudioContextClass=window.AudioContext||window.webkitAudioContext;
 if(!AudioContextClass)return null;
 if(!audioCtx)audioCtx=new AudioContextClass();
 if(audioCtx.state==='suspended')audioCtx.resume();
 return audioCtx;
}
function beep(freq,dur,type='sine',vol=.16,endFreq=freq){
 const c=getAudio();if(!c)return;
 const now=c.currentTime,o=c.createOscillator(),g=c.createGain();
 o.type=type;o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq),now+dur);
 g.gain.setValueAtTime(Math.max(.001,vol),now);g.gain.exponentialRampToValueAtTime(.001,now+dur);
 o.connect(g);g.connect(c.destination);o.start(now);o.stop(now+dur);
}
function laserSound(){
 const c=getAudio();if(!c)return;
 const now=c.currentTime;
 const osc=c.createOscillator(),gain=c.createGain(),filter=c.createBiquadFilter();
 osc.type='sawtooth';osc.frequency.setValueAtTime(980,now);osc.frequency.exponentialRampToValueAtTime(120,now+.24);
 filter.type='lowpass';filter.frequency.setValueAtTime(1800,now);filter.frequency.exponentialRampToValueAtTime(350,now+.22);
 gain.gain.setValueAtTime(.16,now);gain.gain.exponentialRampToValueAtTime(.001,now+.24);
 osc.connect(filter);filter.connect(gain);gain.connect(c.destination);osc.start(now);osc.stop(now+.25);
 beep(1450,.11,'square',.045,480);
}
const shootSound=()=>{shotCount++;laserSound()};
const goodSound=()=>[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>beep(f,.15,'triangle',.13,f*1.12),i*65));
const badSound=()=>{beep(210,.28,'sawtooth',.13,90);setTimeout(()=>beep(120,.22,'square',.09,65),90)};
const warningSound=()=>{beep(520,.09,'square',.045,390);setTimeout(()=>beep(520,.09,'square',.045,390),130)};
const winSound=()=>[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,.2,'triangle',.13,f*1.08),i*115));
const loseSound=()=>[440,330,220,150].forEach((f,i)=>setTimeout(()=>beep(f,.24,'sawtooth',.11,f*.7),i*150));

function toggleSound(){
 soundOn=!soundOn;
 document.getElementById('soundBtn').textContent=soundOn?'🔊 Suara: ON':'🔇 Suara: OFF';
 if(soundOn)getAudio();
}

function startGame(){
 getAudio();
 const name=document.getElementById('nameInput').value.trim()||'Anak';
 level=+document.getElementById('levelSelect').value;
 document.getElementById('playerName').textContent=name;
 qIndex=0;score=0;lives=3;state='play';bullets=[];bubbles=[];particles=[];shootingStars=[];shotCount=0;
 document.getElementById('score').textContent=score;
 document.getElementById('lives').textContent=lives;
 document.getElementById('menu').classList.add('hidden');
 document.getElementById('result').classList.add('hidden');
 document.getElementById('hud').classList.remove('hidden');
 document.getElementById('questionBox').classList.remove('hidden');
 document.getElementById('msg').classList.remove('hidden');
 resize();loadQuestion();loop();
}

function backToMenu(){
 state='menu';
 document.getElementById('menu').classList.remove('hidden');
 document.getElementById('result').classList.add('hidden');
 document.getElementById('hud').classList.add('hidden');
 document.getElementById('questionBox').classList.add('hidden');
 document.getElementById('msg').classList.add('hidden');
}

function loadQuestion(){
 const L=LEVELS[level],Q=L.questions[qIndex];
 document.getElementById('questionBox').textContent=L.icon+' '+Q.q;
 document.getElementById('qNum').textContent=(qIndex+1)+'/'+L.questions.length;
 bullets=[];bubbles=[];
 const positions=[.25,.5,.75];
 Q.opts.forEach((opt,i)=>{
  bubbles.push({x:W*positions[i],y:-50-i*70,r:44,text:opt,correct:i===Q.a,speed:.55+Math.random()*.35,hit:false,warned:false});
 });
 document.getElementById('msg').textContent='Sentuh jawaban untuk menembaknya!';
}

function nextQuestion(){
 if(state!=='play')return;
 qIndex++;
 if(qIndex>=LEVELS[level].questions.length){finish(true);return;}
 loadQuestion();
}

function finish(win){
 if(state==='over')return;
 state='over';
 document.getElementById('hud').classList.add('hidden');
 document.getElementById('questionBox').classList.add('hidden');
 document.getElementById('msg').classList.add('hidden');
 document.getElementById('result').classList.remove('hidden');
 if(win){
  winSound();document.getElementById('resultIcon').textContent='🏆';
  document.getElementById('resultTitle').textContent='Misi Berhasil!';
  document.getElementById('resultText').innerHTML='Hebat, <b>'+document.getElementById('playerName').textContent+'</b>!<br>Nilai: <b>'+score+'</b><br>Kamu telah menyelesaikan '+LEVELS[level].title+'.';
 }else{
  loseSound();document.getElementById('resultIcon').textContent='💫';
  document.getElementById('resultTitle').textContent='Coba Lagi!';
  document.getElementById('resultText').innerHTML='Jangan menyerah, <b>'+document.getElementById('playerName').textContent+'</b>!<br>Nilai: <b>'+score+'</b><br>Coba lagi misi '+LEVELS[level].title+'.';
 }
}

function createExplosion(x,y){
 const colors=['#fff176','#ffca28','#ff7043','#80deea','#ffffff','#ff8a65'];
 for(let i=0;i<34;i++){
  const angle=Math.random()*Math.PI*2,speed=1.5+Math.random()*5;
  particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:30+Math.random()*18,maxLife:48,size:2+Math.random()*5,color:colors[Math.floor(Math.random()*colors.length)]});
 }
 particles.push({x,y,vx:0,vy:0,life:18,maxLife:18,size:10,color:'#fff'});
}

function shoot(target=null){
 if(state!=='play')return;
 const bullet={x:plane.x,y:plane.y-34,vx:0,vy:-10,target};
 if(target){
  const angle=Math.atan2(target.y-bullet.y,target.x-bullet.x);
  bullet.vx=Math.cos(angle)*11;bullet.vy=Math.sin(angle)*11;
 }
 bullets.push(bullet);shootSound();
}

function update(){
 anim+=.03;
 stars.forEach(s=>{s.y+=s.s;if(s.y>H){s.y=0;s.x=Math.random()*W} s.phase+=.04});
 if(Math.random()<.012)shootingStars.push({x:Math.random()*W*.8,y:Math.random()*H*.48,vx:3+Math.random()*3,vy:2+Math.random()*2,life:32});
 shootingStars.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.life--});
 shootingStars=shootingStars.filter(s=>s.life>0);
 particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy=p.vy*.96+.035;p.life--});
 particles=particles.filter(p=>p.life>0);
 if(state!=='play')return;
 if(keys.ArrowLeft||keys.a)plane.x-=7;
 if(keys.ArrowRight||keys.d)plane.x+=7;
 if(touchX!==null)plane.x+=(touchX-plane.x)*.18;
 plane.x=Math.max(38,Math.min(W-38,plane.x));
 bullets.forEach(b=>{
  if(b.target&&!b.target.hit){
   const dx=b.target.x-b.x,dy=b.target.y-b.y,d=Math.hypot(dx,dy)||1;
   b.vx=dx/d*11;b.vy=dy/d*11;
  }
  b.x+=b.vx;b.y+=b.vy;
 });
 bullets=bullets.filter(b=>b.y>-30&&b.y<H+30&&b.x>-30&&b.x<W+30);
 bubbles.forEach(b=>{
  b.y+=b.speed;
  if(b.y>H-190&&!b.warned){b.warned=true;warningSound();document.getElementById('msg').textContent='Cepat! Jawaban hampir lolos! ⚡';}
 });
 bubbles=bubbles.filter(b=>b.y<H+60&&!b.hit);

 bullets.forEach(b=>{
  if(b.dead)return;
  bubbles.forEach(bl=>{
   if(b.dead||bl.hit||(b.target&&b.target!==bl))return;
   if(Math.hypot(b.x-bl.x,b.y-bl.y)<bl.r+8){
    b.dead=true;bl.hit=true;
    if(bl.correct){
     createExplosion(bl.x,bl.y);goodSound();score+=25;
     document.getElementById('score').textContent=score;
     document.getElementById('msg').textContent='Tepat sasaran! +25 poin ⭐';
     bubbles=[];setTimeout(nextQuestion,700);
    }else{
     createExplosion(bl.x,bl.y);badSound();lives--;
     document.getElementById('lives').textContent=lives;
     document.getElementById('msg').textContent='Belum tepat! Pilih jawaban lain 💥';
     if(lives<=0)finish(false);
    }
   }
  });
 });
 bullets=bullets.filter(b=>!b.dead);
}

function draw(){
 ctx.clearRect(0,0,W,H);
 // softly animated sky glow
 const glow=ctx.createRadialGradient(W*.5,H*.48,20,W*.5,H*.48,H*.72);
 glow.addColorStop(0,'rgba(39,112,190,.18)');glow.addColorStop(1,'rgba(3,15,40,.08)');
 ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
 // twinkling stars and shooting stars
 stars.forEach(s=>{ctx.globalAlpha=s.alpha*(.65+.35*Math.sin(s.phase+anim));ctx.fillStyle='#fff';ctx.fillRect(s.x,s.y,s.s,s.s)});
 ctx.globalAlpha=1;
 shootingStars.forEach(s=>{
  const tail=ctx.createLinearGradient(s.x-s.vx*7,s.y-s.vy*7,s.x,s.y);
  tail.addColorStop(0,'rgba(128,222,234,0)');tail.addColorStop(1,'rgba(200,245,255,.95)');
  ctx.strokeStyle=tail;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.x-s.vx*7,s.y-s.vy*7);ctx.lineTo(s.x,s.y);ctx.stroke();
 });
 // moon and orbiting sparkle
 ctx.save();ctx.shadowColor='#fff9c4';ctx.shadowBlur=22;ctx.fillStyle='#fff9c4';ctx.beginPath();ctx.arc(W-60,80,28,0,Math.PI*2);ctx.fill();ctx.restore();
 ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='14px serif';ctx.fillText('✦',W-99,54+Math.sin(anim*2)*4);
 // moving clouds
 for(let i=0;i<6;i++){
  const x=((i*113+anim*24)%(W+130))-65,y=120+i*38+Math.sin(anim+i)*5;
  ctx.fillStyle=i%2?'rgba(255,255,255,.10)':'rgba(115,204,255,.11)';
  ctx.beginPath();ctx.ellipse(x,y,55,18,0,0,Math.PI*2);ctx.ellipse(x-25,y+4,25,14,0,0,Math.PI*2);ctx.ellipse(x+25,y+5,28,13,0,0,Math.PI*2);ctx.fill();
 }
 // animated distant city / landscape silhouettes for added depth
 ctx.fillStyle='rgba(7,28,57,.35)';
 for(let i=0;i<9;i++){
  const bw=30+(i%3)*13,bh=35+(i*17%58),x=i*(W/8)-10;
  ctx.fillRect(x,H-20-bh,bw,bh);
  ctx.fillStyle='rgba(255,226,130,.32)';
  for(let wy=H-16-bh;wy<H-28;wy+=14)ctx.fillRect(x+7,wy,3,4);
  ctx.fillStyle='rgba(7,28,57,.35)';
 }
 // answers
 bubbles.forEach(b=>{
  const pulse=1+Math.sin(anim*5+b.x)*.035;
  ctx.save();ctx.translate(b.x,b.y);ctx.scale(pulse,pulse);
  ctx.shadowColor=b.warned?'#ff5252':(b.correct?'#69f0ae':'#ffb74d');ctx.shadowBlur=12+Math.sin(anim*4)*4;
  ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);
  ctx.fillStyle=b.correct?'rgba(129,199,132,.95)':'rgba(255,183,77,.95)';
  ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=b.warned?'#ff5252':'#fff';ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle='#08306b';ctx.font='bold 14px Comic Sans MS';ctx.textAlign='center';
  const words=b.text.split(' ');let line='',lines=[];
  words.forEach(w=>{if(ctx.measureText(line+w).width>70){lines.push(line);line=w+' '}else line+=w+' '});
  lines.push(line.trim());lines.forEach((t,i)=>ctx.fillText(t,0,-6+i*16));
  ctx.restore();
 });
 // impact explosion particles
 particles.forEach(p=>{
  const alpha=Math.max(0,p.life/p.maxLife);
  ctx.globalAlpha=alpha;ctx.shadowColor=p.color;ctx.shadowBlur=12;
  ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*alpha,0,Math.PI*2);ctx.fill();
 });
 ctx.globalAlpha=1;ctx.shadowBlur=0;
 // bright, glowing laser projectiles
 bullets.forEach(b=>{
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);
  ctx.shadowColor='#40eaff';ctx.shadowBlur=20;
  ctx.fillStyle='rgba(255,145,0,.58)';ctx.beginPath();ctx.ellipse(0,6,9,22,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#45e8ff';ctx.beginPath();ctx.ellipse(0,0,6,16,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,-2,2,10,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
 });
 // plane with engine glow
 ctx.save();ctx.translate(plane.x,plane.y);
 ctx.shadowColor='#45e8ff';ctx.shadowBlur=14+Math.sin(anim*10)*5;
 ctx.font='46px serif';ctx.textAlign='center';ctx.fillText('✈️',0,16);
 ctx.restore();ctx.shadowBlur=0;
 if(state==='play'||state==='menu')requestAnimationFrame(loop);
}

function loop(){update();draw()}

function canvasPoint(e){
 const rect=cv.getBoundingClientRect();
 return {x:(e.clientX-rect.left)*(W/rect.width),y:(e.clientY-rect.top)*(H/rect.height)};
}
function answerAt(point){
 return bubbles.find(b=>!b.hit&&Math.hypot(point.x-b.x,point.y-b.y)<=b.r);
}
document.addEventListener('keydown',e=>{
 keys[e.key]=true;
 if(e.code==='Space'){e.preventDefault();shoot()}
});
document.addEventListener('keyup',e=>keys[e.key]=false);
cv.addEventListener('pointerdown',e=>{
 const point=canvasPoint(e),answer=answerAt(point);
 if(answer){touchX=null;shoot(answer)}
 else{touchX=point.x;shoot()}
});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')touchX=canvasPoint(e).x});
cv.addEventListener('pointerup',()=>touchX=null);
cv.addEventListener('pointercancel',()=>touchX=null);
resize();loop();
</script>
</body>
</html>
